# Nginx configuration for Aurous Pragyan Next.js application
# This file should be placed at: /etc/nginx/sites-available/aurous-pragyan

upstream next_app {
    # Next.js application runs on port 3000
    server localhost:3000;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aurousacademy.com www.aurousacademy.com;

    # Certbot will add SSL configuration here automatically
    # If using certbot, you can leave this as is
    
    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Handle static files efficiently
    location /_next/static {
        proxy_pass http://next_app/_next/static;
        proxy_cache_valid 60m;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    # Handle public assets
    location /public {
        proxy_pass http://next_app/public;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

