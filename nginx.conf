# Nginx configuration for Aurous Pragyan Next.js application
# This file should be placed at: /etc/nginx/sites-available/aurous-pragyan

upstream next_app {
    # Next.js application runs on port 4001
    server localhost:4001;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aurousacademy.com www.aurousacademy.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aurousacademy.com www.aurousacademy.com;

    ssl_certificate /etc/letsencrypt/live/aurousacademy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurousacademy.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /_next/static {
        proxy_pass http://next_app/_next/static;
        proxy_cache_valid 60m;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:jpg|jpeg|gif|png|webp|avif|svg|ico|css|js|woff2?)$ {
        proxy_pass http://next_app;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
